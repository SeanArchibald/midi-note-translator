name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

env:
  PLUGIN_NAME: MidiNoteTranslator

jobs:
  # ============================================================================
  # BUILD JOBS
  # ============================================================================
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check bundled license texts
        run: |
          diff -u clap-sdk/LICENSE LICENSES/CLAP-SDK.txt
          diff -u clap-helpers/LICENSE LICENSES/CLAP-HELPERS.txt

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install
        run: cmake --install build --config Release

      - name: Validate CLAP plugin
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/free-audio/clap-validator/releases/tags/0.4.1 \
            | jq -r '.assets[] | select(.name | test("ubuntu")) | .browser_download_url' \
            | head -n1)
          curl -fsSL -o clap-validator.zip "$url"
          mkdir -p clap-validator
          unzip -q clap-validator.zip -d clap-validator
          tarball=$(find clap-validator -name '*.tar.gz' | head -n1)
          if [ -n "$tarball" ]; then tar -xzf "$tarball" -C clap-validator; fi
          validator=$(find clap-validator -type f -name clap-validator | head -n1)
          chmod +x "$validator"
          "$validator" validate "install/${PLUGIN_NAME}.clap" --only-failed

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r install/${PLUGIN_NAME}.clap artifacts/
          cp LICENSE.md THIRD_PARTY_NOTICES.md artifacts/
          cp -r LICENSES artifacts/
          chmod +x artifacts/${PLUGIN_NAME}.clap
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-linux
          path: artifacts
          retention-days: 7

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install
        run: cmake --install build --config Release

      - name: Sign and verify the universal bundle
        run: |
          codesign --force --sign - "install/${PLUGIN_NAME}.clap"
          codesign --verify --strict --verbose=2 "install/${PLUGIN_NAME}.clap"
          lipo "install/${PLUGIN_NAME}.clap/Contents/MacOS/${PLUGIN_NAME}" -verify_arch arm64 x86_64
          lipo "install/${PLUGIN_NAME}.clap/Contents/MacOS/${PLUGIN_NAME}" -info

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r install/${PLUGIN_NAME}.clap artifacts/
          cp LICENSE.md THIRD_PARTY_NOTICES.md artifacts/
          cp -r LICENSES artifacts/
          chmod +x artifacts/${PLUGIN_NAME}.clap/Contents/MacOS/${PLUGIN_NAME}
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-macos
          path: artifacts
          retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Install
        run: cmake --install build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item -Path "install\${env:PLUGIN_NAME}.clap" -Destination "artifacts\" -Recurse
          Copy-Item -Path LICENSE.md, THIRD_PARTY_NOTICES.md -Destination "artifacts\"
          Copy-Item -Path LICENSES -Destination "artifacts\" -Recurse
          Get-ChildItem -Path "artifacts" -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}-windows
          path: artifacts
          retention-days: 7

  # ============================================================================
  # CREATE RELEASE (only on tags or manual trigger with version)
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ${{ env.PLUGIN_NAME }}-*
          merge-multiple: false

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Package artifacts
        run: |
          mkdir -p releases

          # Linux
          chmod +x artifacts/${PLUGIN_NAME}-linux/${PLUGIN_NAME}.clap
          cd artifacts/${PLUGIN_NAME}-linux
          zip -r ../../releases/${PLUGIN_NAME}-linux-x64.zip *
          cd ../..

          # macOS
          chmod +x artifacts/${PLUGIN_NAME}-macos/${PLUGIN_NAME}.clap/Contents/MacOS/${PLUGIN_NAME}
          cd artifacts/${PLUGIN_NAME}-macos
          zip -r ../../releases/${PLUGIN_NAME}-macos-universal.zip *
          cd ../..

          # Windows
          cd artifacts/${PLUGIN_NAME}-windows
          zip -r ../../releases/${PLUGIN_NAME}-windows-x64.zip *
          cd ../..

          ls -la releases/

      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.version }}
          files: releases/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
