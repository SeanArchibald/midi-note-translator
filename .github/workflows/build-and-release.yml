name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

env:
  PLUGIN_NAME: ScaleScaler

jobs:
  # ============================================================================
  # BUILD JOBS
  # ============================================================================
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Install
        run: cmake --install build --config Release

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r install/${PLUGIN_NAME}.clap artifacts/
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-linux
          path: artifacts/${{ env.PLUGIN_NAME }}.clap
          retention-days: 7

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake || true

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Install
        run: cmake --install build --config Release

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp -r install/${PLUGIN_NAME}.clap artifacts/
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-macos
          path: artifacts/${{ env.PLUGIN_NAME }}.clap
          retention-days: 7

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item -Path "install\${env:PLUGIN_NAME}.clap" -Destination "artifacts\" -Recurse
          Get-ChildItem -Path "artifacts" -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-windows
          path: artifacts/${{ env.PLUGIN_NAME }}.clap
          retention-days: 7

  # ============================================================================
  # CREATE RELEASE (only on tags or manual trigger with version)
  # ============================================================================
  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ${{ env.PLUGIN_NAME }}-*
          merge-multiple: false

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Package artifacts
        run: |
          mkdir -p releases

          # Linux
          cd artifacts/${PLUGIN_NAME}-linux
          zip -r ../../releases/${PLUGIN_NAME}-linux-x64.zip ${PLUGIN_NAME}.clap
          cd ../..

          # macOS
          cd artifacts/${PLUGIN_NAME}-macos
          zip -r ../../releases/${PLUGIN_NAME}-macos-universal.zip ${PLUGIN_NAME}.clap
          cd ../..

          # Windows
          cd artifacts/${PLUGIN_NAME}-windows
          zip -r ../../releases/${PLUGIN_NAME}-windows-x64.zip ${PLUGIN_NAME}.clap
          cd ../..

          ls -la releases/

      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.version }}
          files: releases/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
